name: ML Pipeline CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Download Titanic Dataset
      run: |
        mkdir -p data/raw
        wget -O data/raw/train.csv https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run tests
      run: |
        pytest tests/ -v --cov=src --cov-report=term-missing

    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        # Build from ROOT with correct context
        docker build -t titanic-api:latest -f api/Dockerfile .

    - name: Test Docker container
      run: |
        docker run -d -p 8000:8000 --name test-api titanic-api:latest
        sleep 8
        curl -f http://localhost:8000/health || exit 1
        docker stop test-api
